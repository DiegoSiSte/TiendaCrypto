<div class="shell">
  <header class="site-header">
    <div class="header-inner">
      <a routerLink="/" class="brand" (click)="menuOpen.set(false)">
        <span class="brand-mark">◈</span>
        <span>crypto<span>diego</span></span>
      </a>

      <nav class="nav" [class.open]="menuOpen()">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="menuOpen.set(false)">Inicio</a>
        <a routerLink="/servicios" routerLinkActive="active" (click)="menuOpen.set(false)">Servicios</a>
        <a routerLink="/tienda" routerLinkActive="active" (click)="menuOpen.set(false)">Tienda</a>
        <a routerLink="/noticias" routerLinkActive="active" (click)="menuOpen.set(false)">Noticias</a>
        <a routerLink="/ordenes" routerLinkActive="active" (click)="menuOpen.set(false)">Mis órdenes</a>
      </nav>

      <div class="header-actions">
        <a routerLink="/carrito" class="cart-link" aria-label="Abrir carrito">
          <span aria-hidden="true">⌁</span>
          @if (cart.count() > 0) {
            <span class="cart-count">{{ cart.count() }}</span>
          }
        </a>
        @if (auth.isLoggedIn()) {
          <div class="user-chip">
            <span>{{ auth.user()?.name }}</span>
            <button type="button" (click)="auth.logout()">Salir</button>
          </div>
        } @else {
          <a routerLink="/auth" class="btn btn-ghost btn-small">Entrar</a>
        }
        <button class="menu-toggle" type="button" aria-label="Abrir menú" (click)="menuOpen.set(!menuOpen())">☰</button>
      </div>
    </div>
  </header>

  <app-price-ticker></app-price-ticker>

  <main>
    <router-outlet></router-outlet>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <div class="brand">
          <span class="brand-mark">◈</span>
          <span>crypto<span>diego</span></span>
        </div>
        <p style="margin-top: 0.7rem; font-size: 0.85rem">HODL con plan. Pagos con BTC, ETH y USDT.</p>
      </div>
      <div class="footer-links">
        <a routerLink="/servicios">Servicios</a>
        <a routerLink="/tienda">Tienda</a>
        <a routerLink="/noticias">Noticias</a>
        <a routerLink="/ordenes">Mis órdenes</a>
        <span>© 2026 CryptoDiego</span>
      </div>
    </div>
  </footer>
</div>

<app-chat-widget></app-chat-widget>
